<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEETECTOR</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script defer src="{{ url_for('static', filename='script.js') }}"></script>
</head>
<body>
    <header>
        <nav class="navbar">
            <h1>DEETECTOR</h1>
        </nav>
    </header>
    <div class="container">
        <h2>Deepfake Video Detection</h2>
        <form id="upload-form" enctype="multipart/form-data">
            <input type="file" id="video-input" name="video" accept="video/mp4" required>
            <button type="submit">Upload & Analyze</button>
        </form>
        <div id="loading" class="hidden">
            <div class="spinner"></div>
            <p>Processing video, please wait...</p>
        </div>
        <div id="results" class="hidden">
            <h2>Results</h2>
            <p><strong>Audio Analysis:</strong> <span id="audio-result"></span></p>
            <p><strong>Video Analysis:</strong> <span id="video-result"></span></p>
        </div>
    </div>
</body>
</html>
